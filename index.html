/* =====================  手書きメモ（ペン・図形・テキスト）  ===================== */
let drawObjects = [];
let drawRedoStack = [];
let drawTool = 'pen';
let drawColor = '#111111';
let drawWidth = 6;
let drawTargetNoteId = null;
let drawTargetDrawingId = null;
let drawFromFab = false;
let drawDocW = 0, drawDocH = 0;
let drawActive = false;
let drawCurrent = null;
let drawCanvas = null, drawCtx = null, drawScaleView = 1, drawDpr = 1;
let drawTextPoint = null;
let drawOpenInitToken = 0;
let drawHasUnsavedChange = false;
let drawLastTouchTime = 0;
let drawLastPointerTime = 0;
let drawInputMode = '';

function normalizeDrawColor(c){
  const v = String(c || '').trim();
  return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : '#111111';
}
function syncDrawControls(){
  drawColor = normalizeDrawColor(drawColor);
  drawWidth = Math.max(1, Number(drawWidth) || 6);
  drawTool = drawTool || 'pen';
  document.querySelectorAll('.draw-color').forEach(btn=>{
    const c = normalizeDrawColor(btn.getAttribute('data-color') || btn.getAttribute('data-c') || btn.dataset.color || btn.dataset.c || '#111111');
    btn.dataset.color = c;
    btn.dataset.c = c;
    btn.setAttribute('data-color', c);
    btn.setAttribute('data-c', c);
    btn.style.setProperty('--draw-color', c);
    btn.style.backgroundColor = c;
    btn.classList.toggle('active', c === drawColor);
    btn.setAttribute('aria-pressed', c === drawColor ? 'true' : 'false');
  });
  document.querySelectorAll('.draw-tool').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tool === drawTool);
    btn.setAttribute('aria-pressed', btn.dataset.tool === drawTool ? 'true' : 'false');
  });
  document.querySelectorAll('.draw-width').forEach(btn=>{
    const active = Number(btn.dataset.w) === drawWidth;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  const input = document.getElementById('drawTextInput');
  const box = document.getElementById('drawTextBox');
  if(input) input.style.color = drawColor;
  if(box) box.style.borderColor = drawColor;
}
function setDrawTool(t){
  drawTool = t || 'pen';
  syncDrawControls();
  if(drawTool !== 'text') cancelDrawTextBox();
}
function setDrawColor(c){
  drawColor = normalizeDrawColor(c);
  syncDrawControls();
}
function setDrawWidth(w){
  drawWidth = Math.max(1, Number(w) || 6);
  syncDrawControls();
}

function newDrawingNote(){
  const now = new Date().toISOString();
  const n = {id:uid(), text:'', color:'white', paper:'plain', fontSize:20, fontColor:'#111111', fontBold:false, fontItalic:false, images:[], drawings:[], tables:[], folderId:(selectedFolder==='all'||selectedFolder==='uncat')?'':selectedFolder, createdAt:now, updatedAt:now};
  notes.unshift(n);
  persist();
  openDrawing(n.id, null, true);
}

function safeCloneDrawObjects(arr){
  if(!Array.isArray(arr)) return [];
  try{ return JSON.parse(JSON.stringify(arr)); }
  catch(e){ return []; }
}

function openDrawing(noteId, drawingId, fromFab){
  const n = notes.find(x=>x.id===noteId);
  if(!n) return;
  drawTargetNoteId = noteId;
  drawTargetDrawingId = drawingId || null;
  drawFromFab = !!fromFab;
  drawObjects = [];
  drawRedoStack = [];
  drawCurrent = null;
  drawTextPoint = null;
  drawActive = false;
  drawHasUnsavedChange = false;
  drawInputMode = '';
  cancelDrawTextBox();
  const ed = document.getElementById('drawEditor');
  if(!ed) return;
  ed.classList.add('open');
  syncDrawControls();
  const token = ++drawOpenInitToken;
  const init = ()=>{
    if(token !== drawOpenInitToken) return;
    initDrawingCanvas(n, drawingId, false);
  };
  requestAnimationFrame(()=>requestAnimationFrame(init));
  setTimeout(init, 160);
}

function initDrawingCanvas(n, drawingId, keepObjects){
  drawCanvas = document.getElementById('drawCanvas');
  if(!drawCanvas) return;
  drawCtx = drawCanvas.getContext && drawCanvas.getContext('2d');
  if(!drawCtx) return;
  const wrap = document.getElementById('drawCanvasWrap');
  drawDpr = Math.min(Math.max(Number(window.devicePixelRatio) || 1, 1), 2);
  const cw = Math.max(1, Math.round((wrap && wrap.clientWidth) || drawCanvas.clientWidth || window.innerWidth || 360));
  const ch = Math.max(1, Math.round((wrap && wrap.clientHeight) || drawCanvas.clientHeight || (window.innerHeight - 170) || 520));
  drawCanvas.width = Math.max(1, Math.round(cw * drawDpr));
  drawCanvas.height = Math.max(1, Math.round(ch * drawDpr));
  drawCanvas.style.width = cw + 'px';
  drawCanvas.style.height = ch + 'px';

  if(keepObjects){
    drawDocW = drawDocW || cw;
    drawDocH = drawDocH || ch;
  }else if(drawingId){
    const d = ((n && n.drawings) || []).find(x=>x && x.id===drawingId);
    drawObjects = d ? safeCloneDrawObjects(d.objects) : [];
    drawDocW = Math.max(1, Number(d && d.w) || cw);
    drawDocH = Math.max(1, Number(d && d.h) || ch);
  }else{
    drawObjects = [];
    drawDocW = cw;
    drawDocH = ch;
  }
  drawScaleView = Math.min(cw / (drawDocW || cw), ch / (drawDocH || ch));
  if(!isFinite(drawScaleView) || drawScaleView <= 0) drawScaleView = 1;
  redrawCanvas();
}

function eventPoint(e){
  const t = (e && e.touches && e.touches[0]) || (e && e.changedTouches && e.changedTouches[0]) || e || {};
  return {clientX:Number(t.clientX)||0, clientY:Number(t.clientY)||0};
}
function drawPointFromEvent(e){
  if(!drawCanvas) drawCanvas = document.getElementById('drawCanvas');
  if(!drawCanvas) return {x:0,y:0};
  const r = drawCanvas.getBoundingClientRect();
  const p = eventPoint(e);
  const s = drawScaleView || 1;
  const x = (p.clientX - r.left) / s;
  const y = (p.clientY - r.top) / s;
  return {
    x: Math.max(0, Math.min(drawDocW || x || 0, x || 0)),
    y: Math.max(0, Math.min(drawDocH || y || 0, y || 0))
  };
}
function preventDrawEvent(e){
  if(e && e.cancelable) e.preventDefault();
}

function drawObjectOn(ctx, o){
  if(!ctx || !o) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = 1;
  const color = normalizeDrawColor(o.color || drawColor);
  const width = Math.max(1, Number(o.width) || drawWidth || 6);
  if(o.type === 'stroke' || o.type === 'marker' || o.type === 'eraser'){
    ctx.strokeStyle = o.type === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = o.type === 'eraser' ? width * 3.2 : (o.type === 'marker' ? width * 2.6 : width);
    if(o.type === 'marker') ctx.globalAlpha = 0.38;
    const pts = Array.isArray(o.points) ? o.points : [];
    if(pts.length){
      ctx.beginPath();
      ctx.moveTo(Number(pts[0].x)||0, Number(pts[0].y)||0);
      if(pts.length === 1) ctx.lineTo((Number(pts[0].x)||0)+.1, (Number(pts[0].y)||0)+.1);
      for(let i=1;i<pts.length;i++) ctx.lineTo(Number(pts[i].x)||0, Number(pts[i].y)||0);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  const x1=Number(o.x1)||0, y1=Number(o.y1)||0, x2=Number(o.x2)||0, y2=Number(o.y2)||0;
  if(o.type === 'line' || o.type === 'arrow'){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    if(o.type === 'arrow'){
      const ang = Math.atan2(y2-y1, x2-x1);
      const len = Math.max(14, width * 3.5);
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2 - len * Math.cos(ang - 0.45), y2 - len * Math.sin(ang - 0.45));
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2 - len * Math.cos(ang + 0.45), y2 - len * Math.sin(ang + 0.45));
      ctx.stroke();
    }
  }else if(o.type === 'rect'){
    ctx.strokeRect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(x2-x1), Math.abs(y2-y1));
  }else if(o.type === 'ellipse'){
    ctx.beginPath();
    ctx.ellipse((x1+x2)/2, (y1+y2)/2, Math.abs(x2-x1)/2 || .5, Math.abs(y2-y1)/2 || .5, 0, 0, Math.PI*2);
    ctx.stroke();
  }else if(o.type === 'text'){
    const size = Math.max(12, Number(o.size)||30);
    ctx.font = `bold ${size}px -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif`;
    ctx.textBaseline = 'top';
    String(o.text || '').split('\n').forEach((line,i)=>ctx.fillText(line, Number(o.x)||0, (Number(o.y)||0) + i * size * 1.3));
  }
  ctx.restore();
}

function redrawCanvas(){
  if(!drawCtx || !drawCanvas) return;
  const ctx = drawCtx;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  ctx.setTransform(drawDpr * drawScaleView, 0, 0, drawDpr * drawScaleView, 0, 0);
  drawObjects.forEach(o=>drawObjectOn(ctx, o));
  if(drawCurrent) drawObjectOn(ctx, drawCurrent);
}

function openDrawTextBox(p){
  const box = document.getElementById('drawTextBox');
  const input = document.getElementById('drawTextInput');
  const wrap = document.getElementById('drawCanvasWrap');
  if(!box || !input || !wrap) return;
  drawTextPoint = p;
  const left = Math.max(8, Math.min(p.x * (drawScaleView||1), Math.max(8, wrap.clientWidth - 170)));
  const top = Math.max(8, Math.min(p.y * (drawScaleView||1), Math.max(8, wrap.clientHeight - 110)));
  box.style.left = left + 'px';
  box.style.top = top + 'px';
  input.value = '';
  const size = drawWidth <= 3 ? 22 : (drawWidth >= 12 ? 44 : 30);
  input.style.fontSize = size + 'px';
  input.style.color = drawColor;
  box.style.borderColor = drawColor;
  box.classList.add('open');
  setTimeout(()=>input.focus(), 30);
}
function cancelDrawTextBox(){
  const box = document.getElementById('drawTextBox');
  const input = document.getElementById('drawTextInput');
  if(box) box.classList.remove('open');
  if(input) input.value = '';
  drawTextPoint = null;
}
function commitDrawTextBox(){
  const input = document.getElementById('drawTextInput');
  if(!input || !drawTextPoint) return cancelDrawTextBox();
  const t = input.value.trim();
  if(t){
    const size = drawWidth <= 3 ? 22 : (drawWidth >= 12 ? 44 : 30);
    drawObjects.push({type:'text', x:drawTextPoint.x, y:drawTextPoint.y, text:t, color:drawColor, size});
    drawRedoStack = [];
    drawHasUnsavedChange = true;
    redrawCanvas();
  }
  cancelDrawTextBox();
}

function drawStart(e, mode){
  const ed = document.getElementById('drawEditor');
  if(!ed || !ed.classList.contains('open')) return;
  if(mode === 'mouse' && Date.now() - drawLastTouchTime < 900) return;
  if(mode === 'touch' && Date.now() - drawLastPointerTime < 350) return;
  if(e && e.pointerType === 'mouse' && e.button !== 0) return;
  if(e && e.isPrimary === false) return;
  preventDrawEvent(e);
  if(!drawCtx){
    const n = notes.find(x=>x.id===drawTargetNoteId) || {drawings:[]};
    initDrawingCanvas(n, drawTargetDrawingId, false);
  }
  const p = drawPointFromEvent(e);
  if(drawTool === 'text'){
    openDrawTextBox(p);
    return;
  }
  drawActive = true;
  drawInputMode = mode || 'pointer';
  drawHasUnsavedChange = true;
  if(mode === 'touch') drawLastTouchTime = Date.now();
  if(mode === 'pointer') drawLastPointerTime = Date.now();
  if(drawCanvas && e && e.pointerId !== undefined){ try{ drawCanvas.setPointerCapture(e.pointerId); }catch(err){} }
  if(drawTool === 'pen' || drawTool === 'marker' || drawTool === 'eraser'){
    drawCurrent = {type: drawTool === 'pen' ? 'stroke' : drawTool, color:drawColor, width:drawWidth, points:[p]};
  }else{
    drawCurrent = {type:drawTool, color:drawColor, width:drawWidth, x1:p.x, y1:p.y, x2:p.x, y2:p.y};
  }
  redrawCanvas();
}
function drawMove(e, mode){
  if(!drawActive || !drawCurrent) return;
  if(mode && drawInputMode && mode !== drawInputMode) return;
  if(e && e.pointerType === 'mouse' && e.buttons === 0) return drawEnd(e, mode);
  preventDrawEvent(e);
  const p = drawPointFromEvent(e);
  if(drawCurrent.points){
    const last = drawCurrent.points[drawCurrent.points.length-1] || p;
    if(Math.abs(last.x-p.x) + Math.abs(last.y-p.y) > 1) drawCurrent.points.push(p);
  }else{
    drawCurrent.x2 = p.x;
    drawCurrent.y2 = p.y;
  }
  redrawCanvas();
}
function drawEnd(e, mode){
  if(!drawActive) return;
  if(mode && drawInputMode && mode !== drawInputMode) return;
  preventDrawEvent(e);
  drawActive = false;
  if(drawCanvas && e && e.pointerId !== undefined){ try{ drawCanvas.releasePointerCapture(e.pointerId); }catch(err){} }
  if(drawCurrent){
    const c = drawCurrent;
    const tiny = !c.points && Math.abs((c.x2||0)-(c.x1||0)) < 3 && Math.abs((c.y2||0)-(c.y1||0)) < 3;
    if(!tiny){ drawObjects.push(c); drawRedoStack = []; }
    drawCurrent = null;
  }
  drawInputMode = '';
  redrawCanvas();
}
function drawPointerDown(e){ drawStart(e, 'pointer'); }
function drawPointerMove(e){ drawMove(e, 'pointer'); }
function drawPointerUp(e){ drawEnd(e, 'pointer'); }
function drawTouchStart(e){ drawStart(e, 'touch'); }
function drawTouchMove(e){ drawMove(e, 'touch'); }
function drawTouchEnd(e){ drawEnd(e, 'touch'); }
function drawMouseDown(e){ drawStart(e, 'mouse'); }
function drawMouseMove(e){ drawMove(e, 'mouse'); }
function drawMouseUp(e){ drawEnd(e, 'mouse'); }

function drawUndo(){
  cancelDrawTextBox();
  if(!drawObjects.length) return;
  drawRedoStack.push(drawObjects.pop());
  drawHasUnsavedChange = true;
  redrawCanvas();
}
function drawRedo(){
  cancelDrawTextBox();
  if(!drawRedoStack.length) return;
  drawObjects.push(drawRedoStack.pop());
  drawHasUnsavedChange = true;
  redrawCanvas();
}
function drawClearAll(){
  cancelDrawTextBox();
  if(!drawObjects.length) return;
  if(confirm('描いたものを全部消しますか？')){
    drawObjects = [];
    drawRedoStack = [];
    drawHasUnsavedChange = true;
    redrawCanvas();
  }
}

function cancelDrawing(){
  const hasObjects = Array.isArray(drawObjects) && drawObjects.length > 0;
  if(hasObjects && drawHasUnsavedChange && !confirm('保存せずに閉じますか？（描いた内容は消えます）')) return;
  closeDrawEditor();
  if(drawFromFab){
    const n = notes.find(x=>x.id===drawTargetNoteId);
    if(n && !(n.text||'').trim() && !(n.images||[]).length && !(n.drawings||[]).length && !(n.tables||[]).length){
      notes = notes.filter(x=>x.id!==drawTargetNoteId);
      persist();
      renderAll();
    }
  }
}
function closeDrawEditor(){
  cancelDrawTextBox();
  const ed = document.getElementById('drawEditor');
  if(ed) ed.classList.remove('open');
  drawActive = false;
  drawCurrent = null;
  drawInputMode = '';
  drawOpenInitToken++;
}

function saveDrawing(){
  const box = document.getElementById('drawTextBox');
  if(box && box.classList.contains('open')) commitDrawTextBox();
  const n = notes.find(x=>x.id===drawTargetNoteId);
  if(!n){ closeDrawEditor(); return; }
  if(!drawObjects.length){ cancelDrawing(); return; }
  const maxSide = 1000;
  const scale = Math.min(1, maxSide / Math.max(drawDocW || 1, drawDocH || 1));
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round((drawDocW || 1) * scale));
  off.height = Math.max(1, Math.round((drawDocH || 1) * scale));
  const ctx = off.getContext('2d');
  if(!ctx){ alert('保存できませんでした。もう一度お試しください。'); return; }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,off.width,off.height);
  ctx.setTransform(scale,0,0,scale,0,0);
  drawObjects.forEach(o=>drawObjectOn(ctx, o));
  let png = '';
  try{ png = off.toDataURL('image/jpeg', 0.78); }
  catch(e){ alert('保存できませんでした。画像サイズを小さくしてお試しください。'); return; }
  n.drawings = Array.isArray(n.drawings) ? n.drawings : [];
  const payload = {id: drawTargetDrawingId || ('d_'+uid()), png, objects:safeCloneDrawObjects(drawObjects), w:drawDocW || off.width, h:drawDocH || off.height};
  if(drawTargetDrawingId){
    const i = n.drawings.findIndex(x=>x && x.id===drawTargetDrawingId);
    if(i >= 0) n.drawings[i] = payload;
    else n.drawings.push(payload);
  }else{
    n.drawings.push(payload);
  }
  n.updatedAt = new Date().toISOString();
  persist();
  closeDrawEditor();
  if(drawFromFab || currentId !== n.id){
    openNote(n.id);
  }else{
    renderDrawingPreview(n);
    const titleEl = document.getElementById('editorTitle');
    const dateEl = document.getElementById('editorDate');
    const saveEl = document.getElementById('saveState');
    if(titleEl) titleEl.textContent = titleOf(n);
    if(dateEl) dateEl.textContent = jaDate(n.updatedAt);
    if(saveEl) saveEl.textContent = '保存済み';
  }
  renderList();
}

function renderDrawingPreview(n){
  const box = document.getElementById('drawingPreview');
  if(!box) return;
  const arr = Array.isArray(n && n.drawings) ? n.drawings : [];
  box.innerHTML = arr.map((d,i)=>`<div class="drawing-item">
    <img src="${escapeHtml(d && d.png || '')}" alt="手書きメモ ${i+1}" draggable="false" onclick="openLightbox(notes.find(x=>x.id===currentId).drawings[${i}].png)">
    <button type="button" class="drawing-edit" onpointerdown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onclick="event.stopPropagation(); openDrawing(currentId, '${escapeHtml(d && d.id || '')}'); return false;">✏️ 編集</button>
    <button type="button" class="drawing-delete" data-index="${i}" aria-label="手書き削除" title="手書き削除">×</button>
  </div>`).join('');
}
function removeDrawing(i, ev){
  stopImageDeleteEvent(ev);
  const n = notes.find(x=>x.id===currentId);
  const idx = Number(i);
  if(!n || !Array.isArray(n.drawings) || !Number.isInteger(idx) || idx < 0 || idx >= n.drawings.length) return false;
  if(!confirm('この手書きメモを削除しますか？')) return false;
  n.drawings.splice(idx,1);
  n.updatedAt = new Date().toISOString();
  persist();
  renderDrawingPreview(n);
  renderList();
  const titleEl = document.getElementById('editorTitle');
  const dateEl = document.getElementById('editorDate');
  const saveEl = document.getElementById('saveState');
  if(titleEl) titleEl.textContent = titleOf(n);
  if(dateEl) dateEl.textContent = jaDate(n.updatedAt);
  if(saveEl) saveEl.textContent = '保存済み';
  return false;
}

function initDrawEvents(){
  const c = document.getElementById('drawCanvas');
  if(c && !c.__drawFullyBound){
    c.__drawFullyBound = true;
    c.addEventListener('pointerdown', drawPointerDown, {passive:false});
    c.addEventListener('pointermove', drawPointerMove, {passive:false});
    c.addEventListener('pointerup', drawPointerUp, {passive:false});
    c.addEventListener('pointercancel', drawPointerUp, {passive:false});
    c.addEventListener('lostpointercapture', drawPointerUp, {passive:false});
    c.addEventListener('touchstart', drawTouchStart, {passive:false});
    c.addEventListener('touchmove', drawTouchMove, {passive:false});
    c.addEventListener('touchend', drawTouchEnd, {passive:false});
    c.addEventListener('touchcancel', drawTouchEnd, {passive:false});
    c.addEventListener('mousedown', drawMouseDown, {passive:false});
    window.addEventListener('mousemove', drawMouseMove, {passive:false});
    window.addEventListener('mouseup', drawMouseUp, {passive:false});
  }
  document.querySelectorAll('.draw-color').forEach(btn=>{
    if(btn.__drawColorBound) return;
    btn.__drawColorBound = true;
    btn.addEventListener('click', e=>{
      if(e && e.cancelable) e.preventDefault();
      if(e) e.stopPropagation();
      setDrawColor(btn.dataset.color || btn.getAttribute('data-color') || btn.getAttribute('data-c'));
    }, false);
  });
  const ti = document.getElementById('drawTextInput');
  if(ti && !ti.__drawTextBound){
    ti.__drawTextBound = true;
    ti.addEventListener('keydown', e=>{
      if(e.key === 'Escape') cancelDrawTextBox();
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter') commitDrawTextBox();
    });
  }
  syncDrawControls();
}
initDrawEvents();
window.addEventListener('resize', ()=>{
  const ed = document.getElementById('drawEditor');
  if(ed && ed.classList.contains('open') && !drawActive){
    const n = notes.find(x=>x.id===drawTargetNoteId) || {drawings:[]};
    initDrawingCanvas(n, drawTargetDrawingId, drawHasUnsavedChange || !drawTargetDrawingId);
  }
});
/* ===================== 手書きここまで ===================== */


/* ===================== 表（Excel風）ここから ===================== */
function addTableToCurrent(){
  const n = notes.find(x=>x.id===currentId);
  if(!n) return;
  n.tables = n.tables || [];
  // 初期3列×3行（1行目は見出し行）
  const cols = 3, rows = 3;
  const grid = [];
  for(let r=0;r<rows;r++){
    const row = [];
    for(let c=0;c<cols;c++) row.push('');
    grid.push(row);
  }
  n.tables.push({id:uid(), grid});
  n.updatedAt = new Date().toISOString();
  persist();
  renderTablePreview(n);
  document.getElementById('editorDate').textContent = jaDate(n.updatedAt);
  document.getElementById('saveState').textContent = '保存済み';
}
function findTable(n, tid){ return (n.tables||[]).find(t=>t.id===tid); }
function tableCellInput(tid, r, c, value){
  const n = notes.find(x=>x.id===currentId);
  if(!n) return;
  const t = findTable(n, tid);
  if(!t) return;
  if(t.grid[r] && typeof t.grid[r][c] !== 'undefined'){
    t.grid[r][c] = value;
    n.updatedAt = new Date().toISOString();
    document.getElementById('saveState').textContent = '保存中...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ persist(); document.getElementById('saveState').textContent='保存済み'; }, 350);
  }
}
function tableAddRow(tid){
  const n = notes.find(x=>x.id===currentId); if(!n) return;
  const t = findTable(n, tid); if(!t) return;
  const cols = t.grid[0] ? t.grid[0].length : 1;
  t.grid.push(new Array(cols).fill(''));
  n.updatedAt = new Date().toISOString(); persist(); renderTablePreview(n);
}
function tableAddCol(tid){
  const n = notes.find(x=>x.id===currentId); if(!n) return;
  const t = findTable(n, tid); if(!t) return;
  t.grid.forEach(row=>row.push(''));
  n.updatedAt = new Date().toISOString(); persist(); renderTablePreview(n);
}
function tableDelRow(tid){
  const n = notes.find(x=>x.id===currentId); if(!n) return;
  const t = findTable(n, tid); if(!t) return;
  if(t.grid.length<=1){ alert('これ以上行を減らせません'); return; }
  t.grid.pop();
  n.updatedAt = new Date().toISOString(); persist(); renderTablePreview(n);
}
function tableDelCol(tid){
  const n = notes.find(x=>x.id===currentId); if(!n) return;
  const t = findTable(n, tid); if(!t) return;
  if(t.grid[0] && t.grid[0].length<=1){ alert('これ以上列を減らせません'); return; }
  t.grid.forEach(row=>row.pop());
  n.updatedAt = new Date().toISOString(); persist(); renderTablePreview(n);
}
function removeTable(tid){
  const n = notes.find(x=>x.id===currentId); if(!n) return;
  if(!confirm('この表を削除しますか？')) return;
  n.tables = (n.tables||[]).filter(t=>t.id!==tid);
  n.updatedAt = new Date().toISOString(); persist();
  renderTablePreview(n);
  document.getElementById('editorTitle').textContent = titleOf(n);
}
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderTablePreview(n){
  const box = document.getElementById('tablePreview');
  if(!box) return;
  const tables = (n && n.tables) || [];
  box.innerHTML = tables.map(t=>{
    const rowsHtml = t.grid.map((row,r)=>{
      const cells = row.map((cell,c)=>
        `<td><input value="${escAttr(cell)}" oninput="tableCellInput('${t.id}',${r},${c},this.value)" placeholder=""></td>`
      ).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<div class="table-block">
      <div class="table-block-head">
        <div class="tb-tools">
          <button onclick="tableAddRow('${t.id}')" title="行を追加">＋行</button>
          <button onclick="tableAddCol('${t.id}')" title="列を追加">＋列</button>
          <button onclick="tableDelRow('${t.id}')" title="行を削除">－行</button>
          <button onclick="tableDelCol('${t.id}')" title="列を削除">－列</button>
        </div>
        <button class="tb-del" onclick="removeTable('${t.id}')" title="表を削除">表を削除</button>
      </div>
      <div class="table-scroll"><table class="note-table"><tbody>${rowsHtml}</tbody></table></div>
    </div>`;
  }).join('');
}
/* ===================== 表ここまで ===================== */


initSortSelect();
renderAll();
clearSearch();
showScreen('list');
restoreFromIndexedDBOnStart();


/* ===== 画像削除イベント委譲：inline onclick に頼らず確実に削除 ===== */
let __lastDeleteTapKey = '';
let __lastDeleteTapTime = 0;
function handleDelegatedImageDelete(ev){
  const target = ev && ev.target;
  const btn = target && target.closest ? target.closest('.image-delete,.cal-image-delete,.drawing-delete') : null;
  if(!btn) return;
  stopImageDeleteEvent(ev);
  const idx = Number(btn.dataset.index);
  const kind = btn.classList.contains('cal-image-delete') ? 'cal' : (btn.classList.contains('drawing-delete') ? 'drawing' : 'note');
  const owner = kind === 'cal' ? selectedCalDate : currentId;
  const key = kind + ':' + owner + ':' + idx;
  const now = Date.now();
  if(__lastDeleteTapKey === key && now - __lastDeleteTapTime < 700) return false;
  __lastDeleteTapKey = key;
  __lastDeleteTapTime = now;
  if(kind === 'cal') return removeCalendarImage(idx, ev);
  if(kind === 'drawing') return removeDrawing(idx, ev);
  return removeImage(idx, ev);
}
function bindImageDeleteDelegates(){
  if(document.__imageDeleteDelegatesBound) return;
  document.__imageDeleteDelegatesBound = true;
  document.addEventListener('pointerdown', function(ev){
    const target = ev && ev.target;
    const btn = target && target.closest ? target.closest('.image-delete,.cal-image-delete,.drawing-delete') : null;
    if(btn) stopImageDeleteEvent(ev);
  }, true);
  document.addEventListener('pointerup', handleDelegatedImageDelete, true);
  document.addEventListener('click', handleDelegatedImageDelete, true);
  document.addEventListener('touchstart', function(ev){
    const target = ev && ev.target;
    const btn = target && target.closest ? target.closest('.image-delete,.cal-image-delete,.drawing-delete') : null;
    if(btn) stopImageDeleteEvent(ev);
  }, {capture:true, passive:false});
  document.addEventListener('touchend', handleDelegatedImageDelete, {capture:true, passive:false});
}

bindImageDeleteDelegates();
