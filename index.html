<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>新しいメモ帳 v12 3D版 画像削除強修正版</title>
<style>
:root{
  --bg:#ffffff; --paper:#fff8bd; --paper2:#ffffff; --line:#e6e6e6;
  --bar:#ffffff; --text:#111; --muted:#6d6550; --accent:#009688;
  --editor-font-size:1.55rem; --editor-line-height:42px;
  --pink:#ffeef4; --blue:#eef5ff; --green:#effaf1; --white:#ffffff;
  --shadow:0 8px 24px rgba(0,0,0,.18);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;min-width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#ddd;color:var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select{font:inherit}
.app{height:100dvh;width:100%!important;min-width:100%!important;max-width:100%!important;margin:0;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{padding:calc(var(--safe-t) + 10px) 14px 10px;background:#f5dc51;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.08);z-index:5}
.logo{font-size:2rem;line-height:1}
.brand{font-size:1.65rem;font-weight:600;letter-spacing:-.04em;color:#333;flex:1}
.brand small{font-size:.7rem;color:#666;margin-left:3px;font-weight:500}
.iconbtn{border:none;background:transparent;font-size:1.65rem;line-height:1;padding:5px 8px;border-radius:12px;color:#222}
.iconbtn:active{background:rgba(0,0,0,.08);transform:scale(.96)}
.toolbar{display:none!important;align-items:center;gap:8px;padding:8px;background:#eee;border-top:1px solid rgba(0,0,0,.08);border-bottom:1px solid rgba(0,0,0,.12)}
.sortbox{flex:1;background:#fafafa;border:1px solid #ddd;border-radius:2px;text-align:center;padding:8px 12px;font-size:1.05rem;font-weight:600;color:#222}
.searchbox{display:none;flex:1;background:#fff;border:1px solid #d7c95f;border-radius:10px;padding:8px 10px;align-items:center;gap:6px}
.searchbox input{border:none;outline:none;background:transparent;flex:1;font-size:1rem}
.screen{display:none;flex:1;overflow:hidden}
.screen.active{display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:92px}
.note-list{padding:14px 12px 96px;display:flex;flex-direction:column;gap:12px}
.note-swipe{position:relative;border-radius:24px;overflow:hidden;touch-action:pan-y;background:#e9edf2;box-shadow:0 8px 18px rgba(0,0,0,.08);min-width:0;user-select:none;-webkit-user-select:none}
.note-card{min-height:62px;width:100%;background:var(--paper);border:1px solid rgba(0,0,0,.08);border-radius:24px;display:flex;align-items:center;padding:14px 18px;gap:10px;cursor:pointer;position:relative;z-index:2;box-shadow:0 8px 18px rgba(0,0,0,.08);overflow:hidden;transform:translateX(var(--note-swipe-x,0px));transition:transform .18s ease, filter .12s ease, opacity .12s ease}
.note-actions{position:absolute;z-index:1;top:0;right:0;bottom:0;width:168px;display:grid;grid-template-columns:repeat(2,1fr);border-radius:0 24px 24px 0;overflow:hidden}
.note-actions button{border:none;color:#fff;font-size:.82rem;font-weight:900;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.note-actions button span{font-size:1.35rem;line-height:1}
.note-actions button.move{background:#4b8fe8}
.note-actions button.delete{background:#ef4d45}
.note-swipe.open .note-card{--note-swipe-x:-168px}
.note-swipe.open{box-shadow:0 10px 24px rgba(40,40,60,.16)}
.note-swipe.reordering{z-index:25;touch-action:none;box-shadow:0 14px 28px rgba(0,0,0,.22)}
.note-swipe.reordering .note-card{opacity:.86;outline:3px solid var(--accent);outline-offset:-3px;transform:scale(.98)}
.note-reorder-mode .note-swipe:not(.reordering) .note-card{transition:transform .12s ease, opacity .12s ease;opacity:.72}
.note-card.pink{background:var(--pink)}
.note-card.blue{background:var(--blue)}
.note-card.green{background:var(--green)}
.note-card.white{background:var(--white)}
.note-card:active{filter:brightness(.96)}
.note-main{flex:1;min-width:0}
.note-title{font-size:1.28rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;text-align:center;color:#222;letter-spacing:-.03em}
.note-preview{display:none}
.note-date{display:none}
.reorder-tools{display:none!important}
.reorder-btn{width:28px;height:26px;border:1px solid #d0d0d0;background:#fff;border-radius:8px;color:#333;font-weight:900;font-size:.9rem;line-height:1}
.reorder-btn:active{background:#e8f7f5;transform:scale(.94)}
.reorder-btn:disabled{opacity:.28;background:#f3f3f3;color:#aaa}
.note-card.manual-mode .note-date{font-size:.78rem}

.empty{padding:56px 24px;text-align:center;color:var(--muted);line-height:1.9}
.fab-area{position:fixed;right:22px;bottom:calc(var(--safe-b) + 76px);display:flex;flex-direction:column;gap:14px;z-index:20}
.fab{width:64px;height:64px;border:none;border-radius:19px;background:var(--accent);color:#fff;font-size:2.35rem;line-height:1;box-shadow:var(--shadow)}
.fab.draw{background:#5b6ee1;font-size:1.7rem}
.fab:active{transform:scale(.94)}
.bottom{height:calc(var(--safe-b) + 62px);padding-bottom:var(--safe-b);background:#fff;border-top:1px solid #ccc;display:grid;grid-template-columns:repeat(3,1fr);z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bottom .nav{font-size:1.45rem;gap:2px}
.bottom .nav span{font-size:.66rem;font-weight:700}
.topnav{background:#eee;border-bottom:1px solid #ccc;display:grid;grid-template-columns:repeat(2,1fr);height:46px}
.topnav .nav{flex-direction:row;gap:6px;font-size:1.2rem}
.topnav .nav span{font-size:.85rem;font-weight:600}
.nav{border:none;background:transparent;color:#666;font-size:1.55rem;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}
.nav span{font-size:.58rem}
.nav.active{color:#009688}
.editor{position:absolute;inset:0;background:var(--paper);z-index:30;display:none;flex-direction:column}
.editor.pink{background:var(--pink)}
.editor.blue{background:var(--blue)}
.editor.green{background:var(--green)}
.editor.white{background:var(--white)}
.editor.open{display:flex}
.editor-top{padding:calc(var(--safe-t) + 7px) 10px 8px;background:#f5dc51;display:flex;align-items:center;gap:8px}
.editor-title{flex:1;font-size:1.35rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-tools{display:flex;gap:2px}
.meta{padding:8px 12px;color:#7b7568;background:#fff9c8;border-bottom:1px solid var(--line);font-size:.95rem;display:flex;justify-content:space-between;gap:10px}
.textwrap{flex:1;position:relative;background:#fff;display:flex;flex-direction:column;min-height:0}
textarea{width:100%;flex:1;min-height:0;resize:none;border:none;outline:none;background-color:transparent;background-image:none;padding:12px 12px 108px;font-size:var(--editor-font-size);line-height:var(--editor-line-height);color:#000}
.editor.yellow{background:var(--paper)}
.editor.yellow .textwrap,.editor.yellow textarea,.editor.yellow .image-preview,.editor.yellow .url-preview,.editor.yellow .table-preview{background-color:var(--paper)}
.editor.pink .textwrap,.editor.pink textarea,.editor.pink .image-preview,.editor.pink .url-preview,.editor.pink .table-preview{background-color:var(--pink)}
.editor.blue .textwrap,.editor.blue textarea,.editor.blue .image-preview,.editor.blue .url-preview,.editor.blue .table-preview{background-color:var(--blue)}
.editor.green .textwrap,.editor.green textarea,.editor.green .image-preview,.editor.green .url-preview,.editor.green .table-preview{background-color:var(--green)}
.editor.white .textwrap,.editor.white textarea,.editor.white .image-preview,.editor.white .url-preview,.editor.white .table-preview{background-color:var(--white)}
.textwrap.pattern-lines textarea{background-image:linear-gradient(to bottom, transparent calc(var(--editor-line-height) - 2px), rgba(0,0,0,.12) calc(var(--editor-line-height) - 1px));background-size:100% var(--editor-line-height);background-position:0 12px}
.textwrap.pattern-grid textarea{background-image:linear-gradient(rgba(0,0,0,.10) 1px, transparent 1px),linear-gradient(90deg, rgba(0,0,0,.10) 1px, transparent 1px);background-size:24px 24px}
.textwrap.pattern-dots textarea{background-image:radial-gradient(rgba(0,0,0,.22) 1.2px, transparent 1.2px);background-size:18px 18px;background-position:9px 9px}
.palette{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.78);backdrop-filter:blur(5px);border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
.swatch.sel{outline:3px solid #333}
.swatch.yellow{background:var(--paper)}
.swatch.pink{background:var(--pink)}
.swatch.blue{background:var(--blue)}
.swatch.green{background:var(--green)}
.swatch.white{background:var(--white)}
.paper-select{border:1px solid rgba(0,0,0,.16);background:#fff;border-radius:12px;padding:7px 9px;font-size:.82rem;color:#333;font-weight:700;outline:none}
.paper-label{font-size:.75rem;color:#555;font-weight:800;margin-left:2px}
.format-btn{border:1px solid rgba(0,0,0,.16);background:#fff;border-radius:12px;padding:7px 9px;font-size:.84rem;font-weight:900;color:#333;min-width:38px;height:36px;line-height:1}
.format-btn.active{background:#333;color:#fff;border-color:#333}
.format-btn.color-btn{position:relative;padding-right:14px}
.format-btn.color-btn::after{content:'';position:absolute;left:9px;right:9px;bottom:5px;height:4px;border-radius:999px;background:var(--fc,#111)}
.format-pop{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 88px);background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:22px;box-shadow:0 12px 36px rgba(0,0,0,.20);padding:14px 14px 16px;z-index:120;display:none}
.format-pop.open{display:block}
.format-pop-head{font-size:1rem;font-weight:900;color:#222;margin-bottom:10px}
.format-size-list{display:flex;flex-direction:column;gap:7px}
.format-size-btn{border:none;background:#f4f4f4;color:#222;border-radius:14px;padding:12px 14px;text-align:left;font-weight:800;font-size:1rem}
.format-size-btn.active{background:#333;color:#fff}
.format-size-btn .sub{display:block;font-size:.75rem;color:#777;font-weight:700;margin-top:3px}
.format-size-btn.active .sub{color:#ddd}
.format-color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.format-color-chip{width:44px;height:44px;border:none;border-radius:50%;border:2px solid rgba(0,0,0,.08);box-shadow:0 4px 10px rgba(0,0,0,.12);position:relative}
.format-color-chip.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.15rem;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.format-pop-actions{display:flex;justify-content:flex-end;margin-top:12px}
.format-close-btn{border:none;background:#222;color:#fff;border-radius:999px;padding:10px 16px;font-weight:900}
.url-preview{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 0;flex-shrink:0;border-top:1px solid rgba(0,0,0,.06)}
.url-preview:empty{display:none}
.url-chip{display:inline-flex;align-items:center;gap:5px;max-width:260px;border:1px solid #bfe4df;background:#eefaf8;color:#00796b;border-radius:18px;padding:7px 11px;text-decoration:none;font-size:.82rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.url-chip:active{filter:brightness(.95);transform:scale(.98)}
.panel{padding:14px 16px 90px}
.panel h2{font-size:1.25rem;margin-bottom:12px}
.menu-card{background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:14px;margin-bottom:10px}
.menu-card button{width:100%;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:12px;font-weight:700;margin-top:8px}
.menu-card button.danger{background:#d44747}
.month-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff5a8;border-bottom:1px solid var(--line)}
.month-head button{border:none;background:#f0df71;border-radius:12px;width:36px;height:32px;font-size:1.2rem}
.month-title{font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#d7cf7a;margin:10px;border:1px solid #d7cf7a;border-radius:10px;overflow:hidden}
.dow,.day{background:#fff8bd;text-align:center;min-height:62px;padding:5px 2px;font-size:.8rem;position:relative;overflow:hidden}
.dow{min-height:auto;font-weight:700;color:#766}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.day.om{opacity:.35;display:block;min-height:62px}
.day.has:not(.has-image)::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#e34343}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day:active{background:#f3e988}

/* Calendar image thumbnails */
.day.has-image{background:#25231e!important;color:#fff;padding:0;justify-content:flex-start;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.day.has-image:active{filter:brightness(.94)}
.cal-cell-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#222}
.day.has-image::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.10) 42%,rgba(0,0,0,.42));z-index:1;pointer-events:none}
.day.has-image .day-num{position:relative;z-index:2;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);font-size:.92rem;font-weight:900;padding:3px 5px;margin-top:2px;border-radius:8px;background:rgba(0,0,0,.22);line-height:1}
.day.has-image .holiday-name{position:relative;z-index:2;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);max-width:94%;background:rgba(192,57,43,.72);border-radius:6px;padding:1px 4px;margin-top:3px}
.cal-img-count{position:absolute;right:3px;bottom:3px;z-index:2;background:rgba(0,0,0,.58);color:#fff;border-radius:9px;padding:1px 6px;font-size:.56rem;font-weight:900;line-height:1.35}
.day.has-image.selected{outline:3px solid var(--accent);outline-offset:-3px}
.day.has-image.today{box-shadow:inset 0 0 0 3px var(--accent)}

/* Japanese holidays */
.dow.sun,.day.sun,.day.holiday{color:#c0392b}
.dow.sat,.day.sat{color:#3569b5}
.day.holiday{background:#fff1f1;font-weight:800}
.day.selected.holiday:not(.has-image){background:#ffe5e5!important}
.day-num{display:block;line-height:1.1}
.holiday-name{display:block;margin-top:1px;font-size:.50rem;line-height:1.05;color:#c0392b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:800}
.day.has:not(.has-image) .holiday-name{padding-bottom:8px}
.hidden{display:none!important}

/* Images */
.note-thumb{width:54px;height:54px;object-fit:cover;border-radius:10px;border:1px solid #ddd;flex-shrink:0;background:#fff}
.image-preview{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 0;background:#fff;flex-shrink:0}
.image-preview:empty{display:none}
.image-item{position:relative;flex:0 0 auto}
.image-item img{height:88px;max-width:160px;object-fit:cover;border-radius:10px;border:1px solid #ddd;display:block;background:#fff}
.image-delete{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border:none;border-radius:50%;background:#d44747;color:#fff;font-size:1rem;line-height:1;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.image-delete:active{transform:scale(.92)}



/* ===== 画像削除タップ修正 ===== */
.image-delete,.cal-image-delete,.drawing-delete{
  z-index:30!important;
  pointer-events:auto!important;
  touch-action:manipulation!important;
  -webkit-touch-callout:none!important;
  user-select:none!important;
  -webkit-user-select:none!important;
}
.image-item,.cal-image-item,.drawing-item{overflow:visible!important;}

/* Folders */
.folder-row{display:none!important;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;padding:8px;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.folder-chip{flex:0 0 auto;border:1px solid #ddd;background:#fff;border-radius:18px;padding:7px 12px;font-size:.82rem;color:#555;font-weight:700;white-space:nowrap}
.folder-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.folder-chip.up{background:#f7f7f7;color:#333;border-style:dashed}
.folder-chip.add-inside{background:#eefaf8;border-color:#bfe4df;color:#00796b}
.folder-add{flex:1;border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 10px;font-size:.95rem;font-weight:700;color:#333}
.folder-badge{display:inline-block;background:#eef7f6;color:#00796b;border:1px solid #c9e8e4;border-radius:10px;padding:1px 7px;font-size:.68rem;margin-right:5px;vertical-align:middle;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor-folder{white-space:nowrap;color:#00796b;font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.folder-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.folder-line{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-size:.9rem}
.folder-name{flex:1;min-width:0;line-height:1.45;cursor:pointer;word-break:break-word}
.folder-name small{display:block;color:#777;font-size:.72rem;font-weight:500;margin-top:2px}
.folder-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:172px}
.folder-line button{width:auto;margin:0;border:none;color:#fff;border-radius:9px;padding:7px 9px;font-size:.74rem;font-weight:700}
.folder-line button.sub{background:var(--accent)}
.folder-line button.edit{background:#d89a24}
.folder-line button.danger{background:#d44747}
.folder-empty{color:#777;font-size:.85rem;margin-top:8px;line-height:1.7}

/* One-touch folder move */
.folder-move{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;display:none;align-items:flex-end;justify-content:center}
.folder-move.open{display:flex}
.folder-move-box{width:100%;max-width:430px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.22);max-height:72vh;display:flex;flex-direction:column;padding-bottom:calc(var(--safe-b) + 10px);overflow:hidden}
.folder-move-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;background:#fff5a8;border-bottom:1px solid var(--line)}
.folder-move-title{font-weight:900;color:#333;font-size:1rem}
.folder-move-hint{font-size:.76rem;color:#6d6550;margin-top:2px}
.folder-move-close{border:none;background:rgba(255,255,255,.78);border-radius:50%;width:36px;height:36px;font-size:1.4rem;line-height:1;color:#333;flex-shrink:0}
.folder-move-list{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 14px;display:flex;flex-direction:column;gap:7px}
.folder-move-btn{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;color:#333;font-size:.92rem;font-weight:800;line-height:1.35;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.folder-move-btn:active{transform:scale(.99);background:#f7f7f7}
.folder-move-btn.active{border-color:var(--accent);background:#eefaf8;color:#00796b}
.folder-move-btn.uncat{background:#fbfbfb}
.folder-move-btn.add{border-style:dashed;background:#fffdf0;color:#9a7500;text-align:center;align-items:center}
.folder-move-path{font-size:.72rem;color:#777;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.folder-move-empty{border:1px dashed #ddd;border-radius:12px;padding:14px;text-align:center;color:#777;font-size:.84rem;line-height:1.7;background:#fafafa}

/* Fullscreen image viewer */
/* ===== 手書きメモ ===== */
.draw-editor{position:fixed;inset:0;background:#fff;z-index:60;display:none;flex-direction:column}
.draw-editor.open{display:flex}
.draw-top{padding:calc(var(--safe-t) + 7px) 8px 7px;background:#f5dc51;display:flex;align-items:center;gap:2px}
.draw-title{flex:1;font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden}
.draw-tools{display:flex;gap:5px;padding:6px 8px;background:#f3f3f3;border-bottom:1px solid #ddd;overflow-x:auto;-webkit-overflow-scrolling:touch}
.draw-tool{border:1px solid #ccc;background:#fff;border-radius:10px;min-width:50px;padding:6px 5px;font-size:1.12rem;line-height:1;color:#333;flex:none}
.draw-tool small{display:block;font-size:.56rem;font-weight:700;margin-top:3px}
.draw-tool.active{background:var(--accent);border-color:var(--accent);color:#fff}
.draw-opts{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fafafa;border-bottom:1px solid #e2e2e2;overflow-x:auto;-webkit-overflow-scrolling:touch}
.draw-color{width:31px;height:31px;border-radius:50%;border:2px solid rgba(0,0,0,.15);flex:none;padding:0}
.draw-color.active{outline:3px solid var(--accent);outline-offset:2px}
.draw-width{border:1px solid #ccc;background:#fff;border-radius:10px;padding:7px 11px;font-size:.78rem;font-weight:700;color:#333;flex:none}
.draw-width.active{background:#333;color:#fff;border-color:#333}
.draw-canvas-wrap{flex:1;position:relative;background:#fff;min-height:0;padding-bottom:var(--safe-b)}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background-image:radial-gradient(rgba(0,0,0,.10) 1px, transparent 1px);background-size:22px 22px}

.draw-text-box{position:absolute;display:none;z-index:5;min-width:150px;max-width:88%;background:rgba(255,255,255,.96);border:3px solid var(--accent);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.draw-text-box.open{display:block}
.draw-text-box textarea{width:100%;min-width:150px;min-height:54px;max-height:180px;border:none;outline:none;resize:none;background:transparent;padding:9px 10px 6px;font-size:24px;line-height:1.35;color:#111;font-weight:800}
.draw-text-box-actions{display:flex;border-top:1px solid rgba(0,0,0,.1);background:#f7fbfa}
.draw-text-box-actions button{flex:1;border:none;background:transparent;padding:8px 6px;font-size:.85rem;font-weight:900;color:#333}
.draw-text-box-actions button.ok{background:var(--accent);color:#fff}
.draw-text-box-actions button.cancel{color:#777}
.drawing-preview{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 8px}
.drawing-item{position:relative;width:106px;height:106px;border-radius:10px;overflow:hidden;border:2px solid rgba(0,0,0,.18);background:#fff}
.drawing-item img{width:100%;height:100%;object-fit:cover}
.drawing-item .drawing-edit{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;border:none;border-radius:8px;font-size:.62rem;font-weight:700;padding:4px 8px}
.drawing-item .drawing-delete{position:absolute;top:2px;right:2px;width:25px;height:25px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:.95rem;line-height:1}
/* 表（Excel風） */
.table-preview{padding:4px 12px 8px}
.table-preview:empty{display:none}
.table-block{position:relative;margin-bottom:14px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;overflow:hidden}
.table-block-head{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#f1f3f5;border-bottom:1px solid #ddd;padding:5px 8px}
.table-block-head .tb-tools{display:flex;gap:4px;flex-wrap:wrap}
.table-block-head button{border:none;border-radius:7px;background:#fff;color:#333;font-size:.72rem;font-weight:700;padding:4px 7px;border:1px solid #ccc;line-height:1}
.table-block-head button.tb-del{background:#ffe3e3;border-color:#ffb3b3;color:#c92a2a}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.note-table{border-collapse:collapse;width:100%;font-size:.85rem;background:#fff}
table.note-table td{border:1px solid #d6d6d6;padding:0;min-width:64px;vertical-align:top}
table.note-table td input{width:100%;min-width:64px;border:none;background:transparent;padding:7px 8px;font-size:.85rem;color:#222;outline:none;box-sizing:border-box}
table.note-table td input:focus{background:#fff7d6}
table.note-table tr:first-child td{background:#f8f9fa;font-weight:700}
table.note-table tr:first-child td input{font-weight:700}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff}
.lightbox-close{position:fixed;top:calc(var(--safe-t) + 12px);right:14px;border:none;background:rgba(255,255,255,.92);color:#111;border-radius:50%;width:42px;height:42px;font-size:1.6rem;line-height:1;z-index:10000}

/* Independent calendar memo */
.cal-day-panel{margin:0 10px 90px;background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}
.cal-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff9c8;border-bottom:1px solid var(--line);padding:10px 12px}
.cal-panel-date{font-weight:800;color:#333}
.cal-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.cal-actions button{border:none;border-radius:10px;padding:7px 9px;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem}
.cal-actions button.danger{background:#d44747}
.cal-textarea{width:100%;min-height:120px;border:none;outline:none;resize:vertical;padding:12px;font-size:1rem;line-height:1.7;background:#fff;color:#111}
.cal-url-preview{background:#fff;padding:8px 12px;border-top:1px solid #eee}
.cal-image-preview{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;background:#fff;border-top:1px solid #eee}
.cal-image-preview:empty{display:none}
.cal-image-item{position:relative;flex:0 0 auto}
.cal-image-item img{height:92px;max-width:168px;object-fit:cover;border-radius:10px;border:1px solid #ddd;background:#fff;display:block}
.cal-image-delete{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border:none;border-radius:50%;background:#d44747;color:#fff;font-size:1rem;line-height:1;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.22)}
/* 選択中の日付：画像セルを壊さないよう、画像なしだけ背景色を変える */
.day.selected:not(.has-image){background:#e3f7f4!important;outline:2px solid var(--accent);outline-offset:-2px}
.day.has-image.selected{outline:3px solid var(--accent);outline-offset:-3px}



/* ===== カード型フォルダ画面：参考画像風 ===== */
#screen-folders{background:#f4f5f7;}
#screen-folders .scroll{padding-bottom:92px;}
.folder-dashboard{
  background:
    radial-gradient(circle at -18% 26%, rgba(171,199,242,.55) 0 17%, transparent 18%),
    radial-gradient(circle at 118% 18%, rgba(178,235,226,.72) 0 20%, transparent 21%),
    #f4f5f7;
  min-height:100%;
  padding:18px 16px 96px;
}
.folder-hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:6px 0 14px;
}
.folder-hero-title{
  font-size:1.85rem;
  font-weight:900;
  letter-spacing:-.04em;
  color:#222;
  line-height:1.05;
}
.folder-hero-sub{
  margin-top:5px;
  font-size:.92rem;
  font-weight:700;
  color:#777;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:230px;
}
.folder-primary{
  border:none;
  border-radius:18px;
  background:#fff;
  color:#333;
  padding:11px 14px;
  font-weight:900;
  font-size:.95rem;
  box-shadow:0 8px 24px rgba(0,0,0,.10);
}
.folder-primary:active{transform:scale(.97);filter:brightness(.96)}
.folder-head-actions{display:flex;gap:8px;align-items:center;position:relative;}
.folder-icon-action{
  width:46px;height:46px;border:none;border-radius:18px;background:#fff;color:#333;
  font-size:1.4rem;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.10);
}
.folder-icon-action:active{transform:scale(.96);filter:brightness(.96)}
.folder-menu-pop{
  position:absolute;right:0;top:54px;z-index:50;width:205px;background:#fff;border-radius:18px;
  box-shadow:0 14px 34px rgba(0,0,0,.18);padding:8px;display:none;
}
.folder-menu-pop.open{display:block;}
.folder-menu-pop button{
  width:100%;border:none;background:transparent;color:#333;text-align:left;border-radius:12px;
  padding:12px 10px;font-size:.95rem;font-weight:800;
}
.folder-menu-pop button:active{background:#f2f4f7;}
.folder-menu-pop button.danger{color:#c0392b;}

.folder-crumb{
  display:flex;
  gap:8px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 0 14px;
}
.folder-crumb button{
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,.82);
  color:#555;
  font-weight:800;
  font-size:.82rem;
  padding:8px 12px;
  white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}
.folder-crumb button.active{background:#222;color:#fff;}
.folder-card-grid{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-bottom:18px;
}
.folder-swipe{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  touch-action:pan-y;
  background:#e9edf2;
  box-shadow:0 8px 20px rgba(40,40,60,.10);
}
.folder-card-tile{
  position:relative;
  z-index:2;
  width:100%;
  min-height:84px;
  border:none;
  border-radius:18px;
  padding:13px 15px;
  color:#222;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(135deg,var(--fc-bg,#fff),#fff);
  cursor:pointer;
  transform:translateX(var(--swipe-x,0px));
  transition:transform .18s ease, filter .12s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}
.folder-card-tile:active{filter:brightness(.98)}
.folder-card-main{display:flex;align-items:center;gap:13px;min-width:0;flex:1;}
.folder-card-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.72rem;
  line-height:1;
  background:rgba(255,255,255,.68);
  color:var(--fc,#009688);
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  flex:0 0 auto;
}
.folder-card-text{min-width:0;flex:1;}
.folder-card-name{
  font-size:1.12rem;
  font-weight:900;
  letter-spacing:-.04em;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.folder-card-count{
  margin-top:4px;
  font-size:.78rem;
  font-weight:800;
  color:#6f7480;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.folder-card-arrow{font-size:1.75rem;font-weight:900;color:#7b818b;flex:0 0 auto;}
.folder-card-actions{
  position:absolute;
  z-index:1;
  top:0;
  right:0;
  bottom:0;
  width:224px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-radius:0 18px 18px 0;
  overflow:hidden;
}
.folder-card-actions button{
  border:none;
  color:#fff;
  font-size:.8rem;
  font-weight:900;
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:center;
  justify-content:center;
}
.folder-card-actions button:nth-child(1){background:#4b8fe8;}
.folder-card-actions button:nth-child(2){background:#7f858d;}
.folder-card-actions button:nth-child(3){background:#ef4d45;}
.folder-card-actions button span{font-size:1.35rem;line-height:1;}
.folder-swipe.open .folder-card-tile{--swipe-x:-224px;}
.folder-swipe.open{box-shadow:0 10px 24px rgba(40,40,60,.16);}
.folder-color-0{--fc:#13a79b;--fc-bg:#e3fbf7;}
.folder-color-1{--fc:#f57c00;--fc-bg:#fff0df;}
.folder-color-2{--fc:#1976d2;--fc-bg:#e7f4ff;}
.folder-color-3{--fc:#d83b7d;--fc-bg:#ffeaf3;}
.folder-color-4{--fc:#6c63df;--fc-bg:#eeeeff;}
.folder-color-5{--fc:#e8525d;--fc-bg:#ffe7e9;}
.folder-color-6{--fc:#1d9bd1;--fc-bg:#e4f8ff;}
.folder-color-7{--fc:#8d56cf;--fc-bg:#f3e9ff;}
.folder-color-8{--fc:#16a085;--fc-bg:#e6fbf6;}
.folder-color-9{--fc:#7b4aa0;--fc-bg:#f2e6f8;}
.folder-color-10{--fc:#43a047;--fc-bg:#eaf8e8;}
.folder-color-11{--fc:#fb8c00;--fc-bg:#fff4df;}
.folder-add-tile{
  border:2px dashed #d2d7df;
  background:#fff!important;
  justify-content:center;
  text-align:center;
}
.folder-add-tile .folder-card-main{justify-content:center;}
.folder-add-tile .folder-card-icon{background:#f2f4f7;color:#999;}
.folder-add-tile .folder-card-name{color:#333;}
.folder-add-tile .folder-card-count{color:#888;}
.folder-empty-grid{
  background:rgba(255,255,255,.75);
  border:1px dashed #d8d8d8;
  border-radius:18px;
  padding:22px 10px;
  text-align:center;
  color:#777;
  font-weight:700;
  line-height:1.7;
}
.folder-swipe-hint{
  padding:12px 8px 4px;
  text-align:center;
  color:#858995;
  font-size:.85rem;
  font-weight:700;
  line-height:1.7;
}
.folder-section-title{padding:8px 4px 2px;color:#333;font-size:.96rem;font-weight:900;letter-spacing:-.03em}
.folder-note-empty{background:rgba(255,255,255,.72);border:1px dashed #d8d8d8;border-radius:18px;padding:16px 10px;text-align:center;color:#777;font-size:.88rem;font-weight:700;line-height:1.7}
@media (max-width:360px){
  .folder-dashboard{padding-left:12px;padding-right:12px;}
  .folder-card-tile{min-height:78px;padding:11px 12px;}
  .folder-card-icon{width:42px;height:42px;font-size:1.45rem;}
  .folder-card-name{font-size:1rem;}
  .folder-card-actions{width:198px;}
  .folder-swipe.open .folder-card-tile{--swipe-x:-198px;}
}

@media (max-width:360px){
  :root{--editor-font-size:1.35rem;--editor-line-height:38px;}
  .brand{font-size:1.45rem}.note-title{font-size:1.12rem}
}


/* ===== 3Dデザイン追加版 ===== */
:root{
  --bg:#d1d5db;
  --text:#000000;
  --bar:#e5e7eb;
  --paper:#fff3a6;
  --paper2:#ffffff;
  --line:#b9bec8;
  --muted:#222222;
  --accent:#00897b;
  --shadow:0 18px 0 rgba(0,0,0,.13),0 26px 42px rgba(0,0,0,.28);
  --deep-shadow:0 16px 0 rgba(0,0,0,.16),0 28px 46px rgba(0,0,0,.30);
  --edge:rgba(255,255,255,.72);
}
html,body{
  background:#d1d5db!important;
  color:#000!important;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 8%, rgba(255,255,255,.58), transparent 28%),
    radial-gradient(circle at 82% 0%, rgba(255,255,255,.38), transparent 25%),
    linear-gradient(145deg,#eef0f4 0%,#d1d5db 48%,#aeb4bf 100%);
  z-index:-1;
}
.app{
  background:linear-gradient(145deg,#edf0f5 0%,#d1d5db 52%,#b5bbc6 100%)!important;
  color:#000!important;
  perspective:1200px;
  transform-style:preserve-3d;
}
*{color:inherit;}
button,select,input,textarea{color:#000;}
.top,.editor-top,.draw-top,.month-head{
  background:linear-gradient(180deg,#fff17a 0%,#f5dc51 48%,#d6ad16 100%)!important;
  color:#000!important;
  border-bottom:1px solid rgba(95,73,0,.35)!important;
  box-shadow:0 8px 0 rgba(150,112,0,.45),0 18px 30px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.86)!important;
  transform:translateZ(18px);
}
.logo,.brand,.brand small,.editor-title,.draw-title,.month-title,.iconbtn{color:#000!important;text-shadow:0 1px 0 rgba(255,255,255,.45);}
.screen.active{background:transparent;}
.scroll{
  background:transparent;
  transform-style:preserve-3d;
}
.note-list{
  perspective:1100px;
  transform-style:preserve-3d;
  gap:18px;
  padding-top:20px;
}
.note-swipe{
  background:transparent!important;
  overflow:visible!important;
  box-shadow:none!important;
  transform-style:preserve-3d;
}
.note-card{
  color:#000!important;
  border:1px solid rgba(0,0,0,.16)!important;
  border-bottom:5px solid rgba(0,0,0,.22)!important;
  background:linear-gradient(145deg,var(--paper) 0%,#fffbe0 60%,#ead774 100%)!important;
  box-shadow:0 12px 0 rgba(121,99,0,.24),0 24px 34px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.86),inset -8px -8px 18px rgba(0,0,0,.055)!important;
  transform:translateX(var(--note-swipe-x,0px)) rotateX(5deg) rotateY(-2deg) translateZ(8px)!important;
  transition:transform .18s ease, box-shadow .18s ease, filter .12s ease, opacity .12s ease!important;
}
.note-card.pink{background:linear-gradient(145deg,#ffeef4 0%,#fff6f9 58%,#f5b8ca 100%)!important;}
.note-card.blue{background:linear-gradient(145deg,#eef5ff 0%,#ffffff 58%,#b9d8ff 100%)!important;}
.note-card.green{background:linear-gradient(145deg,#effaf1 0%,#ffffff 58%,#bfe8c8 100%)!important;}
.note-card.white{background:linear-gradient(145deg,#ffffff 0%,#f7f7f7 58%,#d9dde5 100%)!important;}
.note-card:active{
  transform:translateX(var(--note-swipe-x,0px)) rotateX(2deg) rotateY(-1deg) translateY(7px) translateZ(2px)!important;
  box-shadow:0 5px 0 rgba(0,0,0,.18),0 14px 22px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.7)!important;
  filter:brightness(.98)!important;
}
.note-title,.note-preview,.note-date,.note-main{color:#000!important;}
.note-actions,.folder-card-actions{
  box-shadow:inset 10px 0 16px rgba(0,0,0,.18);
}
.note-actions button,.folder-card-actions button{
  color:#fff!important;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}
.fab-area{perspective:900px;}
.fab,.folder-primary,.folder-icon-action,.iconbtn,.month-head button,.cal-actions button,.menu-card button,.format-btn,.format-close-btn,.draw-tool,.draw-width,.folder-move-btn{
  transform:translateZ(10px);
  box-shadow:0 8px 0 rgba(0,0,0,.18),0 16px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.55)!important;
  border-bottom:3px solid rgba(0,0,0,.18)!important;
}
.iconbtn,.format-btn,.draw-tool,.draw-width,.month-head button{
  background:linear-gradient(180deg,#ffffff,#dfe3ea)!important;
}
.fab{
  background:linear-gradient(145deg,#00a99a 0%,#00897b 54%,#00675b 100%)!important;
  color:#fff!important;
  border:1px solid rgba(0,0,0,.22)!important;
}
.fab.draw{background:linear-gradient(145deg,#7f8cff 0%,#5b6ee1 52%,#3d48a8 100%)!important;}
.fab:active,.folder-primary:active,.folder-icon-action:active,.iconbtn:active,.month-head button:active,.cal-actions button:active,.menu-card button:active,.format-btn:active,.draw-tool:active,.draw-width:active,.folder-move-btn:active{
  transform:translateY(6px) translateZ(2px)!important;
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.45)!important;
}
.bottom{
  background:linear-gradient(180deg,#ffffff 0%,#e2e6ed 55%,#b9c0cb 100%)!important;
  border-top:1px solid rgba(0,0,0,.18)!important;
  box-shadow:0 -8px 0 rgba(0,0,0,.10),0 -18px 26px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9)!important;
  transform:translateZ(20px);
}
.nav{color:#000!important;text-shadow:0 1px 0 rgba(255,255,255,.65);}
.nav.active{
  color:#000!important;
  font-weight:900;
  transform:translateY(-2px) translateZ(12px);
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.2));
}
.editor,.draw-editor{
  background:linear-gradient(145deg,#e9edf2 0%,#cdd2db 100%)!important;
  color:#000!important;
  perspective:1200px;
}
.meta,.cal-panel-head,.table-block-head{
  background:linear-gradient(180deg,#fffbe0,#e9e2a1)!important;
  color:#000!important;
  box-shadow:0 5px 0 rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.8)!important;
}
.textwrap,.cal-day-panel,.table-block,.menu-card,.format-pop,.folder-move-box,.lightbox img{
  border:1px solid rgba(0,0,0,.15)!important;
  border-bottom:5px solid rgba(0,0,0,.20)!important;
  border-radius:22px!important;
  background:linear-gradient(145deg,#ffffff 0%,#edf0f5 100%)!important;
  color:#000!important;
  box-shadow:0 12px 0 rgba(0,0,0,.12),0 26px 36px rgba(0,0,0,.24),inset 0 2px 0 rgba(255,255,255,.85)!important;
  margin:12px;
  overflow:hidden;
  transform:translateZ(8px);
}
.editor.yellow .textwrap,.editor.yellow textarea,.editor.yellow .image-preview,.editor.yellow .url-preview,.editor.yellow .table-preview{background:linear-gradient(145deg,#fff8bd,#f3e680)!important;}
.editor.pink .textwrap,.editor.pink textarea,.editor.pink .image-preview,.editor.pink .url-preview,.editor.pink .table-preview{background:linear-gradient(145deg,#ffeef4,#f6c6d5)!important;}
.editor.blue .textwrap,.editor.blue textarea,.editor.blue .image-preview,.editor.blue .url-preview,.editor.blue .table-preview{background:linear-gradient(145deg,#eef5ff,#c8ddfb)!important;}
.editor.green .textwrap,.editor.green textarea,.editor.green .image-preview,.editor.green .url-preview,.editor.green .table-preview{background:linear-gradient(145deg,#effaf1,#c9ebd0)!important;}

/* ===== メモ並び替えスムーズ修正版 ===== */
.note-card{will-change:transform;}
.note-drag-handle{
  width:38px;
  height:38px;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,.68);
  color:#000!important;
  font-size:1.25rem;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 9px rgba(0,0,0,.12);
  pointer-events:none;
}
.note-reorder-mode .scroll{
  overscroll-behavior:contain;
}
.note-reorder-mode .note-swipe{
  touch-action:none!important;
}
.note-reorder-mode .note-swipe:not(.reordering) .note-card{
  opacity:.82!important;
  transition:transform .16s ease, opacity .16s ease!important;
}
.note-swipe.reordering{
  z-index:80!important;
  touch-action:none!important;
  overflow:visible!important;
}
.note-swipe.reordering .note-card{
  opacity:.98!important;
  outline:3px solid var(--accent)!important;
  outline-offset:-3px!important;
  transition:none!important;
  box-shadow:0 8px 0 rgba(0,0,0,.18),0 20px 36px rgba(0,0,0,.30),inset 0 2px 0 rgba(255,255,255,.86)!important;
  transform:translateX(var(--note-swipe-x,0px)) translateY(var(--note-drag-y,0px)) rotateX(1deg) rotateY(0deg) scale(1.025) translateZ(28px)!important;
}
.note-swipe.reordering .note-drag-handle{
  background:#111!important;
  color:#fff!important;
}
@media (hover:hover){
  .note-reorder-mode .note-card:hover{
    transform:translateX(var(--note-swipe-x,0px))!important;
  }
  .note-swipe.reordering .note-card:hover{
    transform:translateX(var(--note-swipe-x,0px)) translateY(var(--note-drag-y,0px)) rotateX(1deg) rotateY(0deg) scale(1.025) translateZ(28px)!important;
  }
}


/* ===== 並び替え長押し固定修正 =====
   画面スクロールと並び替えが競合しないよう、↕ハンドルだけで即ドラッグ開始 */

}
.note-card.manual-mode{

  user-select:none!important;

}

<script>
// ストレージ安全ラッパー（localStorageの容量不足時はIndexedDBへ退避保存）
const __memStore = {};
const KEY = 'new_colormemo_notes_v1';
const FOLDER_KEY = 'new_colormemo_folders_v1';
const CAL_KEY = 'new_colormemo_calendar_v1';
const SORT_KEY = 'new_colormemo_sort_v1';
const STORE_META_KEY = 'new_colormemo_store_meta_v1';
const IDB_NAME = 'new_colormemo_storage_v2';
const IDB_STORE = 'kv';
let __memoDbPromise = null;
let __storageErrorShown = false;

function setSaveStateText(text){
  const el = document.getElementById('saveState');
  if(el) el.textContent = text;
}
function showStorageError(err){
  console.warn('memo save error', err);
  setSaveStateText('保存エラー');
  if(!__storageErrorShown){
    __storageErrorShown = true;
    alert('保存容量がいっぱい、またはブラウザの保存が制限されています。画像を小さくしてIndexedDBへ保存するよう修正済みですが、念のためバックアップもしてください。');
  }
}
function lsGet(k){
  try{
    const v = localStorage.getItem(k);
    return v!==null ? v : (k in __memStore ? __memStore[k] : null);
  }catch(e){
    return (k in __memStore) ? __memStore[k] : null;
  }
}
function lsSet(k,v){
  __memStore[k]=v;
  try{
    localStorage.setItem(k,v);
    return true;
  }catch(e){
    return false;
  }
}
function openMemoDb(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDBが使えません'));
  if(__memoDbPromise) return __memoDbPromise;
  __memoDbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'key'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB open error'));
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
  return __memoDbPromise;
}
function idbGetItem(k){
  return openMemoDb().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const store = tx.objectStore(IDB_STORE);
    const req = store.get(k);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error('IndexedDB read error'));
  }));
}
function idbSetItem(k,v,updatedAt){
  const ts = Number(updatedAt) || Date.now();
  return openMemoDb().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    store.put({key:k, value:v, updatedAt:ts});
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('IndexedDB write error'));
    tx.onabort = () => reject(tx.error || new Error('IndexedDB write aborted'));
  }));
}
let __storeMeta = loadStoreMeta();
function loadStoreMeta(){
  try{
    const raw = localStorage.getItem(STORE_META_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return obj && typeof obj === 'object' && !Array.isArray(obj) ? obj : {};
  }catch(e){ return {}; }
}
function saveStoreMeta(){
  try{ localStorage.setItem(STORE_META_KEY, JSON.stringify(__storeMeta)); }catch(e){}
}
function markStoreWrite(k, localOk, ts){
  __storeMeta[k] = {updatedAt:Number(ts)||Date.now(), localOk:!!localOk};
  saveStoreMeta();
}
function localStoreIsNewEnough(k, idbUpdatedAt){
  const meta = __storeMeta && __storeMeta[k];
  if(!meta || !meta.localOk) return false;
  if(lsGet(k) === null) return false;
  return Number(meta.updatedAt || 0) >= Number(idbUpdatedAt || 0);
}
function saveData(k,v){
  const ts = Date.now();
  const localOk = lsSet(k,v);
  markStoreWrite(k, localOk, ts);
  idbSetItem(k,v,ts).then(()=>{
    if(!localOk) setSaveStateText('保存済み');
  }).catch(err=>{
    if(!localOk) showStorageError(err);
  });
  return localOk;
}
function normalizeNotesArray(saved){
  if(!Array.isArray(saved)) return null;
  return saved.map(n=>({
    folderId:'', images:[], drawings:[], tables:[], paper:'plain', fontSize:20, fontColor:'#111111', fontBold:false, fontItalic:false,

function maxUpdatedInNotes(arr){
  if(!Array.isArray(arr)) return 0;
  return arr.reduce((m,n)=>Math.max(m, Date.parse((n && (n.updatedAt || n.createdAt)) || '') || 0), 0);
}
function looksLikeStarterNotes(arr){

  return arr.length >= 8 && text.includes('スマホやっては行けないこと') && text.includes('画像編集');
}
function shouldUseStoredNotes(incoming, current, idbUpdatedAt){
  if(!Array.isArray(incoming) || !incoming.length) return false;
  if(!Array.isArray(current) || !current.length) return true;
  if(looksLikeStarterNotes(current) && !looksLikeStarterNotes(incoming)) return true;
  const inMax = maxUpdatedInNotes(incoming);
  const curMax = maxUpdatedInNotes(current);
  if(inMax > curMax) return true;
  if(inMax === curMax && incoming.length > current.length) return true;
  if(idbUpdatedAt && inMax >= curMax && JSON.stringify(incoming).length > JSON.stringify(current).length) return true;
  return false;
}
function maxUpdatedInCalendarEntries(obj){
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)) return 0;
  return Object.values(obj).reduce((m,e)=>Math.max(m, Date.parse((e && e.updatedAt) || '') || 0), 0);
}
function calendarEntryCount(obj){
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)) return 0;
  return Object.values(obj).filter(e=>e && (((e.text || '').trim()) || (Array.isArray(e.images) && e.images.length))).length;
}
function shouldUseStoredCalendarEntries(incoming, current){
  if(!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) return false;
  if(!current || typeof current !== 'object' || Array.isArray(current) || !Object.keys(current).length) return true;
  const inMax = maxUpdatedInCalendarEntries(incoming);
  const curMax = maxUpdatedInCalendarEntries(current);
  if(inMax > curMax) return true;
  if(inMax === curMax && calendarEntryCount(incoming) > calendarEntryCount(current)) return true;
  return false;
}
async function restoreFromIndexedDBOnStart(){
  try{
    const [noteItem, folderItem, calItem] = await Promise.all([
      idbGetItem(KEY).catch(()=>null),
      idbGetItem(FOLDER_KEY).catch(()=>null),
      idbGetItem(CAL_KEY).catch(()=>null)
    ]);
    let changed = false;
    if(noteItem && noteItem.value && !localStoreIsNewEnough(KEY, noteItem.updatedAt)){
      const parsedNotes = normalizeNotesArray(JSON.parse(noteItem.value));
      if(shouldUseStoredNotes(parsedNotes, notes, noteItem.updatedAt)){
        notes = parsedNotes;
        changed = true;
      }
    }
    if(folderItem && folderItem.value && !localStoreIsNewEnough(FOLDER_KEY, folderItem.updatedAt)){
      const parsedFolders = normalizeFolders(JSON.parse(folderItem.value));
      if(Array.isArray(parsedFolders) && (parsedFolders.length > folders.length || !folders.length)){
        folders = parsedFolders;
        changed = true;
      }
    }
    if(calItem && calItem.value && !localStoreIsNewEnough(CAL_KEY, calItem.updatedAt)){
      const parsedCal = JSON.parse(calItem.value);
      if(shouldUseStoredCalendarEntries(parsedCal, calendarEntries)){
        calendarEntries = parsedCal;
        changed = true;
      }
    }
    if(changed){
      renderAll();
      if(currentId && notes.some(n=>n.id===currentId)) openNote(currentId);
    }
  }catch(e){
    console.warn('IndexedDB restore skipped', e);
  }
}

function normalizeFolders(arr){
  if(!Array.isArray(arr)) return [];
  const cleaned = arr.filter(f=>f && f.id && f.name).map(f=>({
    id:String(f.id), name:String(f.name).trim(), parentId:f.parentId ? String(f.parentId) : ''
  })).filter(f=>f.name);
  const ids = new Set(cleaned.map(f=>f.id));
  cleaned.forEach(f=>{ if(!ids.has(f.parentId) || f.parentId===f.id) f.parentId=''; });
  // 循環参照があった場合はトップ階層に戻す
  cleaned.forEach(f=>{
    const seen = new Set([f.id]);
    let p = f.parentId;
    while(p){
      if(seen.has(p)){ f.parentId=''; break; }
      seen.add(p);
      const parent = cleaned.find(x=>x.id===p);
      p = parent ? parent.parentId : '';
    }
  });
  return cleaned;
}
function loadFolders(){
  try{

function nthMonday(year, month, nth){
  const first = new Date(year, month-1, 1);
  const offset = (8 - first.getDay()) % 7;
  return 1 + offset + (nth-1)*7;
}
function equinoxDay(year, type){
  if(type === 'spring'){
    if(year <= 1979) return Math.floor(20.8357 + 0.242194*(year-1980) - Math.floor((year-1983)/4));
    if(year <= 2099) return Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
    return Math.floor(21.851 + 0.242194*(year-2000) - Math.floor((year-2000)/4));
  }
  if(year <= 1979) return Math.floor(23.2588 + 0.242194*(year-1980) - Math.floor((year-1983)/4));
  if(year <= 2099) return Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  return Math.floor(24.2488 + 0.242194*(year-2000) - Math.floor((year-2000)/4));
}
function addHoliday(map, year, month, day, name){
  map[`${year}-${pad(month)}-${pad(day)}`] = name;
}
function baseJapaneseHolidays(year){
  const map = {};
  addHoliday(map, year, 1, 1, '元日');
  if(year >= 2000) addHoliday(map, year, 1, nthMonday(year,1,2), '成人の日');
  else if(year >= 1949) addHoliday(map, year, 1, 15, '成人の日');

  if(year >= 1967) addHoliday(map, year, 2, 11, '建国記念の日');
  if(year >= 2020) addHoliday(map, year, 2, 23, '天皇誕生日');

  if(year >= 1949) addHoliday(map, year, 3, equinoxDay(year,'spring'), '春分の日');

  if(year >= 2007) addHoliday(map, year, 4, 29, '昭和の日');
  else if(year >= 1989) addHoliday(map, year, 4, 29, 'みどりの日');
  else if(year >= 1949) addHoliday(map, year, 4, 29, '天皇誕生日');

  if(year >= 1949){
    addHoliday(map, year, 5, 3, '憲法記念日');
    if(year >= 2007) addHoliday(map, year, 5, 4, 'みどりの日');
    addHoliday(map, year, 5, 5, 'こどもの日');
  }

  if(year === 2020) addHoliday(map, year, 7, 23, '海の日');
  else if(year === 2021) addHoliday(map, year, 7, 22, '海の日');
  else if(year >= 2003) addHoliday(map, year, 7, nthMonday(year,7,3), '海の日');
  else if(year >= 1996) addHoliday(map, year, 7, 20, '海の日');

  if(year === 2020) addHoliday(map, year, 8, 10, '山の日');
  else if(year === 2021) addHoliday(map, year, 8, 8, '山の日');
  else if(year >= 2016) addHoliday(map, year, 8, 11, '山の日');

  if(year >= 2003) addHoliday(map, year, 9, nthMonday(year,9,3), '敬老の日');
  else if(year >= 1966) addHoliday(map, year, 9, 15, '敬老の日');
  if(year >= 1948) addHoliday(map, year, 9, equinoxDay(year,'autumn'), '秋分の日');

  if(year === 2020) addHoliday(map, year, 7, 24, 'スポーツの日');
  else if(year === 2021) addHoliday(map, year, 7, 23, 'スポーツの日');
  else if(year >= 2000) addHoliday(map, year, 10, nthMonday(year,10,2), year >= 2020 ? 'スポーツの日' : '体育の日');
  else if(year >= 1966) addHoliday(map, year, 10, 10, '体育の日');

  if(year >= 1948){
    addHoliday(map, year, 11, 3, '文化の日');
    addHoliday(map, year, 11, 23, '勤労感謝の日');
  }
  if(year >= 1989 && year <= 2018) addHoliday(map, year, 12, 23, '天皇誕生日');
  return map;
}
const jpHolidayCache = {};
function getJapaneseHolidays(year){
  if(jpHolidayCache[year]) return jpHolidayCache[year];
  const map = baseJapaneseHolidays(year);
  const daysInYear = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
  const keyAt = i => {
    const d = new Date(year,0,i);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  };
  // 国民の休日：祝日と祝日に挟まれた平日
  if(year >= 1986){
    for(let i=2;i<daysInYear;i++){
      const prev = keyAt(i-1), cur = keyAt(i), next = keyAt(i+1);
      const dt = new Date(cur);
      if(!map[cur] && dt.getDay() !== 0 && map[prev] && map[next]) map[cur] = '国民の休日';
    }
  }
  // 振替休日：日曜の祝日の次の平日（連休の場合は次の空き日）
  if(year >= 1973){
    for(let i=1;i<=daysInYear;i++){
      const key = keyAt(i);
      const dt = new Date(key);
      if(map[key] && dt.getDay() === 0){
        let j = i + 1;
        while(j <= daysInYear && map[keyAt(j)]) j++;
        if(j <= daysInYear) map[keyAt(j)] = '振替休日';
      }
    }
  }
  jpHolidayCache[year] = map;
  return map;
}

function folderById(id){ return folders.find(f=>f.id===id) || null; }
function isFolderId(id){ return !!folderById(id); }
function folderChildren(parentId=''){
  return folders.filter(f=>(f.parentId||'')===(parentId||'')).slice().sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}
function folderPathArray(id){
  const out = [];
  let cur = folderById(id);
  const seen = new Set();
  while(cur && !seen.has(cur.id)){
    out.unshift(cur);
    seen.add(cur.id);
    cur = folderById(cur.parentId);
  }
  return out;
}
function folderPath(id){
  const arr = folderPathArray(id);
  return arr.length ? arr.map(f=>f.name).join(' / ') : '';
}
function getDescendantFolderIds(id){
  const result = [];
  const stack = [id];
  while(stack.length){
    const parent = stack.pop();
    folderChildren(parent).forEach(ch=>{ result.push(ch.id); stack.push(ch.id); });
  }
  return result;
}
function folderCount(id){
  if(id==='all') return notes.length;
  if(id==='uncat') return notes.filter(n=>!n.folderId || !isFolderId(n.folderId)).length;
  if(!isFolderId(id)) return 0;
  const ids = new Set([id, ...getDescendantFolderIds(id)]);
  return notes.filter(n=>ids.has(n.folderId)).length;
}
function directFolderCount(id){

}

function deleteFolder(id){
  const f = folderById(id);
  if(!f) return;
  const ids = new Set([id, ...getDescendantFolderIds(id)]);
  const noteCount = notes.filter(n=>ids.has(n.folderId)).length;
  const childCount = ids.size - 1;
  if(!confirm(`フォルダ「${folderPath(id)}」を削除しますか？\n子フォルダ ${childCount}個も削除されます。\n中のメモ ${noteCount}件は未分類に戻ります。`)) return;
  const parentAfter = f.parentId || 'all';
  folders = folders.filter(x=>!ids.has(x.id));
  notes.forEach(n=>{ if(ids.has(n.folderId)) n.folderId=''; });
  if(ids.has(selectedFolder)) selectedFolder = parentAfter;
  persistFolders(); persist(); renderAll(); renderFolderManageList();

    if(isFolderId(selectedFolder)){
      // フォルダを開いた時は、そのフォルダ直下のメモだけ表示

let noteSwipeData = null;

function noteSwipeStart(ev,el){

    pointerId:ev.pointerId,
    pointerType:ev.pointerType || 'touch',
    moved:false,
    longTimer:null,
    isHandle:isHandle
  };
  // 並び替えは↕ハンドルだけで開始。長押し待ちをやめて、画面スクロールとの競合を防ぐ。
  if(getSortMode() === 'manual' && isHandle && !el.classList.contains('open')){
    ev.preventDefault();
    ev.stopPropagation();
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    beginNoteReorder(ev,el);
    return;
  }
  // ハンドル以外では通常スクロール・左右スワイプ・メモを開く操作を優先する。

function beginNoteReorder(ev,el){
  if(!noteSwipeData || noteSwipeData.moved || noteReorderData) return;
  const list = document.getElementById('noteList');
  if(!list || !el || el.parentElement !== list) return;
  clearNoteLongPress();
  closeNoteSwipes(el);
  const rect = el.getBoundingClientRect();
  noteReorderData = {
    row:el,
    id:el.dataset.id,
    pointerId:noteSwipeData.pointerId || ev.pointerId,
    startY:noteSwipeData.y,
    lastY:noteSwipeData.y,
    rowStartTop:rect.top,
    rowHeight:rect.height,
    raf:0,
    scrollRaf:0
  };
  el.style.setProperty('--note-drag-y','0px');
  el.classList.add('reordering');
  document.body.classList.add('note-reorder-mode');
  try{ el.setPointerCapture(noteReorderData.pointerId); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}
function noteSwipeMove(ev,el){
  if(noteReorderData && noteReorderData.row === el){
    ev.preventDefault();
    ev.stopPropagation();
    noteReorderMove(ev.clientY);
    return;
  }
  if(!noteSwipeData) return;
  const dx = ev.clientX - noteSwipeData.x;
  const dy = ev.clientY - noteSwipeData.y;
  if(Math.abs(dx) > 8 || Math.abs(dy) > 8) clearNoteLongPress();
  if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) noteSwipeData.moved = true;
  if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)){
    noteSwipeData.moved = true;
    if(dx < -26){ closeNoteSwipes(el); el.classList.add('open'); }
    if(dx > 26){ el.classList.remove('open'); }
  }
}
function noteReorderMove(clientY){
  if(!noteReorderData) return;
  noteReorderData.lastY = clientY;
  if(noteReorderData.raf) return;
  noteReorderData.raf = requestAnimationFrame(()=>{
    if(!noteReorderData) return;
    noteReorderData.raf = 0;
    updateNoteDragVisual();
    reorderNoteByPointer();
    autoScrollNoteList();
  });
}
function updateNoteDragVisual(){
  if(!noteReorderData) return;
  const dy = noteReorderData.lastY - noteReorderData.startY;
  noteReorderData.row.style.setProperty('--note-drag-y', dy + 'px');
}
function reorderNoteByPointer(){
  if(!noteReorderData) return;
  const list = document.getElementById('noteList');
  const row = noteReorderData.row;
  if(!list || !row) return;
  const y = noteReorderData.lastY;
  const siblings = Array.from(list.querySelectorAll('.note-swipe')).filter(item=>item !== row);
  let beforeNode = null;
  for(const item of siblings){
    const rect = item.getBoundingClientRect();
    if(y < rect.top + rect.height / 2){ beforeNode = item; break; }
  }
  const oldTop = row.getBoundingClientRect().top;
  if(beforeNode){
    if(row.nextSibling !== beforeNode) list.insertBefore(row,beforeNode);
  }else if(row !== list.lastElementChild){
    list.appendChild(row);
  }
  const newTop = row.getBoundingClientRect().top;
  if(newTop !== oldTop){
    noteReorderData.startY += (newTop - oldTop);
    updateNoteDragVisual();
  }
}
function autoScrollNoteList(){
  if(!noteReorderData) return;
  const list = document.getElementById('noteList');
  const scroller = list ? list.closest('.scroll') : null;
  if(!scroller) return;
  const rect = scroller.getBoundingClientRect();
  const y = noteReorderData.lastY;
  const margin = 78;
  let speed = 0;
  if(y < rect.top + margin) speed = -Math.round((rect.top + margin - y) / 5) - 4;
  else if(y > rect.bottom - margin) speed = Math.round((y - (rect.bottom - margin)) / 5) + 4;
  if(speed === 0) return;
  const row = noteReorderData.row;
  const oldTop = row.getBoundingClientRect().top;
  scroller.scrollTop += speed;
  const newTop = row.getBoundingClientRect().top;
  noteReorderData.startY += (newTop - oldTop);
  updateNoteDragVisual();
  if(noteReorderData.scrollRaf) return;
  noteReorderData.scrollRaf = requestAnimationFrame(()=>{
    if(!noteReorderData) return;
    noteReorderData.scrollRaf = 0;
    noteReorderMove(noteReorderData.lastY);
  });
}
function noteSwipeEnd(ev,el){
  clearNoteLongPress();
  if(noteReorderData && noteReorderData.row === el){
    finishNoteReorder();
  }
  noteSwipeData = null;
}
function noteSwipeCancel(ev,el){
  clearNoteLongPress();
  if(noteReorderData && noteReorderData.row === el){
    finishNoteReorder();
  }
  noteSwipeData = null;
}
function finishNoteReorder(){
  if(!noteReorderData) return;
  const data = noteReorderData;
  const row = data.row;
  if(data.raf) cancelAnimationFrame(data.raf);
  if(data.scrollRaf) cancelAnimationFrame(data.scrollRaf);
  row.style.setProperty('--note-drag-y','0px');
  row.classList.remove('reordering');
  document.body.classList.remove('note-reorder-mode');
  commitNoteOrderFromDom();
  try{ row.releasePointerCapture(data.pointerId); }catch(e){}
  noteReorderData = null;
  noteReorderEndedAt = Date.now();
}
function commitNoteOrderFromDom(){
  if(getSortMode() !== 'manual') return;
  const list = document.getElementById('noteList');
  if(!list) return;
  const ids = Array.from(list.querySelectorAll('.note-swipe')).map(el=>el.dataset.id).filter(Boolean);
  if(ids.length < 2) return;
  const idSet = new Set(ids);
  const byId = new Map(notes.map(n=>[n.id,n]));
  const visibleOrdered = ids.map(id=>byId.get(id)).filter(Boolean);
  const visibleByFolder = new Set(ids);
  let p = 0;
  notes = notes.map(n=> visibleByFolder.has(n.id) ? (visibleOrdered[p++] || n) : n);
  persist();
}

function moveNoteInView(id, dir){
  if(getSortMode() !== 'manual') return;
  const visible = sortedNotes();
  const from = visible.findIndex(n=>n.id===id);
  const to = from + dir;
  if(from < 0 || to < 0 || to >= visible.length) return;
  const itemIndex = notes.findIndex(n=>n.id===visible[from].id);
  const targetId = visible[to].id;
  if(itemIndex < 0) return;
  const [item] = notes.splice(itemIndex, 1);
  const targetIndex = notes.findIndex(n=>n.id===targetId);
  if(targetIndex < 0){ notes.splice(itemIndex, 0, item); return; }
  notes.splice(dir < 0 ? targetIndex : targetIndex + 1, 0, item);
  persist();
  renderList();
}

function addImageToCurrent(e){
  const n = notes.find(x=>x.id===currentId);
  const files = Array.from(e.target.files || []);
  if(!n || !files.length) return;
  files.forEach(file=>{
    if(!file.type || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => resizeImage(reader.result, dataUrl=>{
      n.images = n.images || [];
      n.images.push(dataUrl);
      n.updatedAt = new Date().toISOString();
      persist();
      renderImagePreview(n);
      document.getElementById('editorDate').textContent = jaDate(n.updatedAt);
      document.getElementById('saveState').textContent = '保存済み';
    });
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}
function resizeImage(dataUrl, done){
  const img = new Image();
  img.onload = () => {
    const maxSide = 900;
    let w = img.width, h = img.height;
    if(Math.max(w,h) > maxSide){
      if(w >= h){ h = Math.round(h * maxSide / w); w = maxSide; }
      else { w = Math.round(w * maxSide / h); h = maxSide; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try{ done(canvas.toDataURL('image/jpeg', 0.72)); }
    catch(err){ done(dataUrl); }
  };
  img.onerror = () => done(dataUrl);
  img.src = dataUrl;
}

function extractUrls(text){
  const re = /(?:https?:\/\/|www\.)[^\s\u3000<>"']+/gi;
  const found = String(text || '').match(re) || [];
  return Array.from(new Set(found.map(u=>u.replace(/[。．、，,.)\]）]+$/,'')))).filter(Boolean).slice(0,12);
}
function normalizeUrl(u){ return /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function shortUrlLabel(u){
  return u.replace(/^https?:\/\//i,'').replace(/^www\./i,'').slice(0,42);
}
function renderUrlPreview(n){
  const box = document.getElementById('urlPreview');
  if(!box) return;
  const urls = extractUrls(n && n.text);
  box.innerHTML = urls.map(u=>{ const href=normalizeUrl(u); return `<a class="url-chip" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">🔗 ${escapeHtml(shortUrlLabel(u))}</a>`; }).join('');
}
function renderCalendarUrlPreview(e){
  const box = document.getElementById('calUrlPreview');

  const urls = extractUrls(e && e.text);
  box.innerHTML = urls.map(u=>{ const href=normalizeUrl(u); return `<a class="url-chip" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">🔗 ${escapeHtml(shortUrlLabel(u))}</a>`; }).join('');
}

function calEntry(key, create=false){
  let e = calendarEntries[key];
  if(!e && create){
    e = calendarEntries[key] = {text:'', images:[], updatedAt:new Date().toISOString()};
  }
  if(e){
    e.images = Array.isArray(e.images) ? e.images : [];
    e.text = e.text || '';
    if(create && e.deletedAt) delete e.deletedAt;
  }
  return e;
}
function hasCalEntry(e){ return !!(e && !e.deletedAt && ((e.text || '').trim() || (e.images || []).length)); }
function markCalendarEntryDeleted(key){
  const now = new Date().toISOString();
  calendarEntries[key] = {text:'', images:[], updatedAt:now, deletedAt:now};
}
function cleanCalendarEntry(key){
  const e = calendarEntries[key];
  if(e && !hasCalEntry(e)){
    if(e.deletedAt) return;
    markCalendarEntryDeleted(key);
  }
}
function moveMonth(delta){
  calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth()+delta, 1);
  selectedCalDate = `${calendarDate.getFullYear()}-${pad(calendarDate.getMonth()+1)}-01`;
  renderCalendar();
}
function renderCalendar(){
  const y = calendarDate.getFullYear(), m = calendarDate.getMonth();
  document.getElementById('calTitle').textContent = `${y}年${m+1}月`;
  const grid = document.getElementById('calGrid');
  const dows = [
    {t:'日', c:'sun'}, {t:'月', c:''}, {t:'火', c:''}, {t:'水', c:''},
    {t:'木', c:''}, {t:'金', c:''}, {t:'土', c:'sat'}
  ];
  let html = dows.map(d=>`<div class="dow ${d.c}">${d.t}</div>`).join('');
  const first = new Date(y,m,1).getDay();
  const total = new Date(y,m+1,0).getDate();
  const prevTotal = new Date(y,m,0).getDate();
  const today = dateKey(new Date());
  for(let i=0;i<first;i++) html += `<div class="day om">${prevTotal-first+i+1}</div>`;
  for(let d=1;d<=total;d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const dow = new Date(y,m,d).getDay();
    const holiday = jpHolidayName(key);
    const entry = calEntry(key, false);
    const imgs = entry && Array.isArray(entry.images) ? entry.images : [];
    const firstImg = imgs[0] || '';
    const hasImage = !!firstImg;
    const hasText = !!(entry && (entry.text || '').trim());
    const hasEntry = hasCalEntry(entry);
    const memoLine = hasText ? (entry.text || '').trim().split(/\n/).map(v=>v.trim()).filter(Boolean).slice(0, 3).map(v=>v.slice(0, 10)).join('\n') : '';
    const titleText = [holiday, hasImage ? `画像${imgs.length}枚` : '', memoLine.replace(/\n/g, ' / ')].filter(Boolean).join(' / ');
    const dayClass = `${hasEntry?'has':''} ${hasImage?'has-image':''} ${hasText?'has-text':''} ${today===key?'today':''} ${selectedCalDate===key?'selected':''} ${dow===0?'sun':''} ${dow===6?'sat':''} ${holiday?'holiday':''}`;
    html += `<div class="day ${dayClass}" ${titleText?`title="${escapeHtml(titleText)}"`:''} onclick="selectCalendarDay('${key}', ${hasImage?'true':'false'})">${hasImage?`<img class="cal-cell-thumb" src="${escapeHtml(firstImg)}" alt="カレンダー画像">`:''}<span class="day-num">${d}</span>${holiday?`<span class="holiday-name">${escapeHtml(holiday)}</span>`:''}${memoLine?`<span class="cal-memo">${escapeHtml(memoLine)}</span>`:''}${hasImage && imgs.length>1?`<span class="cal-img-count">+${imgs.length}</span>`:''}</div>`;
  }
  const rem = (7 - ((first+total)%7))%7;
  for(let i=1;i<=rem;i++) html += `<div class="day om">${i}</div>`;
  grid.innerHTML = html;
  renderCalendarPanel();
}

function importNotes(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      const importedNotes = Array.isArray(data) ? data : data.notes;
      if(!Array.isArray(importedNotes)) throw new Error('bad');
      notes = importedNotes.map(n=>({
        id:n.id||uid(), text:n.text||htmlToPlainTextSafe(n.html||''), color:n.color||'white', paper:n.paper||n.paperType||'plain', fontSize:Number(n.fontSize)||20, fontColor:n.fontColor||'#111111', fontBold:!!n.fontBold, fontItalic:!!n.fontItalic,
        images:Array.isArray(n.images)?n.images:[], drawings:Array.isArray(n.drawings)?n.drawings:[], tables:Array.isArray(n.tables)?n.tables:[], folderId:n.folderId||'',
        createdAt:n.createdAt||new Date().toISOString(), updatedAt:n.updatedAt||new Date().toISOString()
      }));
      if(data && !Array.isArray(data)){
        folders = Array.isArray(data.folders) ? normalizeFolders(data.folders) : folders;
        calendarEntries = (data.calendarEntries && typeof data.calendarEntries === 'object') ? data.calendarEntries : calendarEntries;
      }
      const validFolderIds = new Set(folders.map(f=>f.id));
      notes.forEach(n=>{ if(n.folderId && !validFolderIds.has(n.folderId)) n.folderId=''; });
      persist(); persistFolders(); persistCalendar(); renderAll(); alert('インポートしました');
    }catch(err){ alert('読み込めませんでした'); }
  };
  r.readAsText(f);
}
function resetNotes(){
  if(confirm('すべてのメモを削除しますか？')){
    notes=[]; persist(); renderAll(); showScreen('list');
  }
}
function renderAll(){ renderList(); renderCalendar(); renderFolderManageList(); renderFolderDashboard(); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function htmlToPlainTextSafe(html){
  if(!html) return '';
  const div = document.createElement('div');
  div.innerHTML = html;
  return String(div.innerText || div.textContent || '').replace(/\u00A0/g,' ').replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trimEnd();
}
function noteFontSize(n){
  const v = Number(n && n.fontSize);
  return [44,34,26,20,16].includes(v) ? v : 20;
}
function noteLineHeight(px){
  if(px >= 44) return 60;
  if(px >= 34) return 50;
  if(px >= 26) return 42;
  if(px >= 20) return 34;
  return 28;
}
function normalizeHexColor(c){
  return /^#[0-9A-Fa-f]{6}$/.test(String(c||'')) ? String(c) : '#111111';
}
function applyEditorTextStyle(n){
